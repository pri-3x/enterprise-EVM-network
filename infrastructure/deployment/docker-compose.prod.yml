# Copy to the application server as docker-compose.prod.yml and run:
#   docker compose -f docker-compose.prod.yml --env-file /etc/besu/app.env up -d
#
# Validators are NOT in this file. Each validator runs from
# infrastructure/systemd/besu-validator.service on its own host.
# RPC_URL in the env file must point at a validator over the private network.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [app]

  api:
    image: ${API_IMAGE:-besu-enterprise/api:local}
    restart: always
    env_file: /etc/besu/app.env
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:4000:4000"
    networks: [app]

  indexer:
    image: ${INDEXER_IMAGE:-besu-enterprise/indexer:local}
    restart: always
    env_file: /etc/besu/app.env
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:4100:4100"
    networks: [app]

  frontend:
    image: ${FRONTEND_IMAGE:-besu-enterprise/frontend:local}
    restart: always
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:3001:3000"
    networks: [app]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [app]

  grafana:
    image: grafana/grafana:12.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.example.com
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3300:3000"
    networks: [app]

networks:
  app:

volumes:
  postgres-data:
  prometheus-data:
