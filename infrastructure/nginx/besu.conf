# Public entrypoint. TLS is terminated here; Besu RPC is never published on 443.
# Replace example.com with the real domain and point certs at /etc/letsencrypt.

upstream api_upstream {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream web_upstream {
    server 127.0.0.1:3001;
    keepalive 8;
}

upstream grafana_upstream {
    server 127.0.0.1:3300;
}

# Redirect plain HTTP to HTTPS for every public name.
server {
    listen 80;
    server_name besu.example.com api.example.com grafana.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name besu.example.com;

    ssl_certificate     /etc/letsencrypt/live/besu.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/besu.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 256k;

    location / {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 70s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.example.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Grafana stays on the management network. Restrict this server block
    # further with `allow <office-cidr>; deny all;` once the CIDR is known.
    location / {
        proxy_pass http://grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
