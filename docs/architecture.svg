    <path d="M280 348 V380 H410"/>
    <path d="M920 348 V380 H790"/>
    <path d="M600 488 V540"/>
    <path d="M140 592 V660"/>
    <path d="M370 592 V660"/>
    <path d="M600 592 V660"/>
    <path d="M830 592 V660"/>
    <path d="M490 592 H140"/>
    <path d="M710 592 H830"/>
    <path d="M320 740 V860"/>
    <path d="M880 740 V860"/>
    <path d="M500 899 H700"/>
  </g>
</svg>
