<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#f7f9fb"/>
  <text x="60" y="70" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#162033">Enterprise Besu Network</text>
  <text x="60" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b7c93">Permissioned QBFT | chain 7117 | four validators</text>

  <rect x="470" y="150" width="260" height="56" rx="10" fill="#0e1420"/>
  <text x="600" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Users</text>

  <rect x="140" y="270" width="280" height="78" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
  <text x="280" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">Next.js dashboard</text>
  <text x="280" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7c93">explorer included</text>

  <rect x="780" y="270" width="280" height="78" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
  <text x="920" y="302" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">Grafana</text>
  <text x="920" y="326" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7c93">Prometheus alerts</text>

  <rect x="410" y="410" width="380" height="78" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
  <text x="600" y="442" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">Fastify API</text>
  <text x="600" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7c93">auth, validation, transaction lifecycle</text>

  <rect x="390" y="540" width="420" height="52" rx="10" fill="#e5f6ef" stroke="#12805f" stroke-width="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f6e56">JSON-RPC on the private network</text>

  <rect x="40" y="660" width="200" height="80" rx="10" fill="#162033"/>
  <text x="140" y="696" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Validator 1</text>
  <text x="140" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d5deea">Besu QBFT</text>

  <rect x="270" y="660" width="200" height="80" rx="10" fill="#162033"/>
  <text x="370" y="696" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Validator 2</text>
  <text x="370" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d5deea">Besu QBFT</text>

  <rect x="500" y="660" width="200" height="80" rx="10" fill="#162033"/>
  <text x="600" y="696" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Validator 3</text>
  <text x="600" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d5deea">Besu QBFT</text>

  <rect x="730" y="660" width="200" height="80" rx="10" fill="#162033"/>
  <text x="830" y="696" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Validator 4</text>
  <text x="830" y="718" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d5deea">Besu QBFT</text>

  <rect x="140" y="860" width="360" height="78" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
  <text x="320" y="892" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">Indexer</text>
  <text x="320" y="916" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7c93">restart-safe, checkpointed</text>

  <rect x="700" y="860" width="360" height="78" rx="10" fill="#ffffff" stroke="#d5deea" stroke-width="2"/>
  <text x="880" y="892" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#162033">PostgreSQL</text>
  <text x="880" y="916" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7c93">blocks, transactions, assets</text>

  <text x="600" y="1040" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3d4d66">N = 4 = 3f + 1, so f = 1. One validator can be down and blocks still finalise.</text>
  <text x="600" y="1068" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3d4d66">Production RPC does not expose admin, debug, or trace methods.</text>

  <g stroke="#3d4d66" stroke-width="2" fill="none">
