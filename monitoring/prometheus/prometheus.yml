global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Validator metrics are only published by validator-1 on the host in local dev.
  # In production each validator is scraped on the private network (see docs/monitoring.md).
  - job_name: besu
    metrics_path: /metrics
    static_configs:
      - targets: ["validator-1:9545"]
        labels: { validator: "validator-1" }

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4100"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
